<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>COLOR HIT PRO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;font-family:Tahoma,sans-serif}
html,body{width:100%;height:100%;background:#111;color:#fff;overflow:hidden}
#wrap{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;background:#18181b;overflow:hidden;touch-action:manipulation}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:0;left:0;right:0;height:52px;background:rgba(12,12,14,.85);padding:0 16px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none}
.hud-left{font-size:13px;color:#fbbf24;font-weight:bold;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:10px}
.score-val{font-size:24px;font-weight:900;letter-spacing:1px}
.hud-btns{display:flex;gap:8px;pointer-events:auto}
.icon-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:14px;display:flex;justify-content:center;align-items:center;cursor:pointer}
.shop-fab{position:absolute;top:64px;left:16px;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.35);display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;z-index:12;font-size:18px}
.shop-fab span{font-size:9px;color:#fbbf24;font-weight:bold;margin-top:1px}
.overlay{position:absolute;inset:0;background:rgba(15,15,18,.95);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;z-index:25}
.hd{display:none!important}
.logo{font-size:30px;font-weight:900;color:#facc15;margin-bottom:6px;letter-spacing:1px}
.sub{font-size:12px;color:#cbd5e1;margin-bottom:14px;text-align:center}
.card{width:100%;max-width:350px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:12px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:bold;color:#fbbf24;margin-bottom:8px;display:flex;justify-content:space-between}
.lb-list{max-height:185px;overflow-y:auto}
.lb-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:10px;margin-bottom:5px;background:rgba(255,255,255,.04);font-size:13px}
.lb-row.me{background:rgba(250,204,21,.18);border:1px solid #facc15}
.lb-user{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.av{width:28px;height:28px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-weight:900;font-size:12px;color:#fff;flex-shrink:0;overflow:hidden;border:1px solid rgba(255,255,255,.3)}
.av img{width:100%;height:100%;object-fit:cover}
.lb-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold}
.btn{width:100%;max-width:350px;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer;margin-bottom:10px}
.btn-play{background:linear-gradient(135deg,#facc15,#f59e0b);color:#111}
.btn-share{background:rgba(255,255,255,.12);color:#fff;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:350px;margin-bottom:12px}
.stat{background:rgba(255,255,255,.07);border-radius:12px;padding:10px;text-align:center}
.skins-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:350px;margin-bottom:14px}
.skin-item{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.15);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer}
.skin-item.active{border-color:#facc15;background:rgba(250,204,21,.16)}
.skin-item.locked{opacity:.65}
.brand-tag{margin-top:6px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:11px;color:#94a3b8;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.brand-tag b{color:#facc15;font-family:sans-serif;direction:ltr}
#toast{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:#facc15;color:#000;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:bold;z-index:50;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="wrap">
<div id="toast"></div>
<div class="hud">
<div class="hud-left" onclick="openMenu()"><span>🏆 <span id="hud-best">0</span></span><span style="color:#fde047">⭐ <span id="hud-stars">0</span></span></div>
<div class="score-val" id="hud-score">0</div>
<div class="hud-btns">
<button class="icon-btn" id="btn-snd" onclick="toggleSound()">🔊</button>
<button class="icon-btn" id="btn-pause" onclick="togglePause()">⏸</button>
</div>
</div>

<div class="shop-fab" id="shop-btn" onclick="openShop()">🛒<span id="fab-stars">0⭐</span></div>
<canvas id="cv"></canvas>

<div class="overlay" id="start-screen">
<div class="logo">🎯 COLOR HIT</div>
<div class="sub">سوزن‌های رنگی را به بخش هم‌رنگ دایره بزن و ستاره‌ها را جمع کن!</div>
<div class="card">
<div class="card-title"><span>🏆 برترین رکوردهای بازیکنان</span><span id="my-rank" style="color:#fff;font-size:11px"></span></div>
<div class="lb-list" id="lb-start">در حال دریافت...</div>
</div>
<button class="btn btn-play" onclick="startGame()">شروع بازی</button>
<button class="btn btn-share" onclick="openShop()">🛒 فروشگاه طرح سوزن‌ها (⭐ <span id="menu-stars">0</span>)</button>
<div class="brand-tag" onclick="openChannel()">🎮 اختصاصی کانال <b>@gamee_balee</b></div>
</div>

<div class="overlay hd" id="shop-screen">
<div class="logo" style="font-size:24px">🛒 فروشگاه طرح‌ها</div>
<div class="sub">موجودی ستاره شما: <b style="color:#facc15" id="shop-stars">0</b> ⭐</div>
<div class="skins-grid" id="skins-grid"></div>
<button class="btn btn-play" onclick="closeShop()">بازگشت</button>
</div>

<div class="overlay hd" id="pause-screen">
<div class="logo" style="color:#38bdf8">توقف بازی</div>
<button class="btn btn-play" onclick="togglePause()">▶️ ادامه بازی</button>
<button class="btn btn-share" onclick="openMenu()">🏠 منو و رده‌بندی</button>
</div>

<div class="overlay hd" id="over-screen">
<div class="logo" style="color:#f43f5e">GAME OVER</div>
<div class="stats">
<div class="stat"><div style="font-size:22px;font-weight:900;color:#facc15" id="end-score">0</div><div style="font-size:11px;color:#94a3b8">امتیاز</div></div>
<div class="stat"><div style="font-size:22px;font-weight:900;color:#4ade80" id="end-best">0</div><div style="font-size:11px;color:#94a3b8">رکورد شما</div></div>
</div>
<div class="card">
<div class="card-title"><span>🏆 جدول نفرات برتر</span></div>
<div class="lb-list" id="lb-over"></div>
</div>
<button class="btn btn-play" onclick="startGame()">🔄 بازی مجدد</button>
<button class="btn btn-share" onclick="shareScore()">📤 کل‌کل و ارسال رکورد</button>
<div class="brand-tag" onclick="openChannel()">🎮 اختصاصی کانال <b>@gamee_balee</b></div>
</div>
</div>

<script>
const DB="https://kido-db.mohammadahmadi0007.workers.dev/colorhit_lb.json";
const BOT_LINK="https://ble.ir/color_hit_game_bot";
const CHANNEL_ID="@gamee_balee";
const CHANNEL_URL="https://ble.ir/gamee_balee";

function openChannel(){
if(window.Bale&&Bale.WebApp&&Bale.WebApp.openLink)Bale.WebApp.openLink(CHANNEL_URL);
else window.open(CHANNEL_URL,"_blank");
}

let usr={id:localStorage.getItem("ch_uid")||("u_"+Math.floor(1e5+Math.random()*9e5)),name:"بازیکن مهمان",photo:""};
localStorage.setItem("ch_uid",usr.id);
try{
const raw=(location.hash||"")+"&"+(location.search||"");
const m=raw.match(/(?:tgWebAppData|baleWebAppData)=([^&]+)/);
if(m&&m[1]){const u=JSON.parse(new URLSearchParams(decodeURIComponent(m[1])).get("user"));if(u&&u.id){usr.id="b_"+u.id;usr.name=[u.first_name,u.last_name].filter(Boolean).join(" ")||"کاربر بله";if(u.photo_url)usr.photo=u.photo_url}}
if(window.Bale&&Bale.WebApp){Bale.WebApp.ready();Bale.WebApp.expand();const u=Bale.WebApp.initDataUnsafe&&Bale.WebApp.initDataUnsafe.user;if(u&&u.id){usr.id="b_"+u.id;usr.name=[u.first_name,u.last_name].filter(Boolean).join(" ")||"کاربر بله";if(u.photo_url)usr.photo=u.photo_url}}
}catch(e){}

const GRADS=["linear-gradient(135deg,#06b6d4,#3b82f6)","linear-gradient(135deg,#ec4899,#8b5cf6)","linear-gradient(135deg,#f59e0b,#ef4444)","linear-gradient(135deg,#10b981,#059669)","linear-gradient(135deg,#6366f1,#a855f7)"];
function avHtml(p){
let s=0;for(let i=0;i<p.id.length;i++)s+=p.id.charCodeAt(i);
const bg=GRADS[s%GRADS.length],ch=(p.name||"؟").trim().charAt(0);
return p.photo?`<div class="av" style="background:${bg}"><img src="${p.photo}" onerror="this.parentNode.innerText='${ch}'"></div>`:`<div class="av" style="background:${bg}">${ch}</div>`;
}

let best=parseInt(localStorage.getItem("ch_best")||"0",10);
let stars=parseInt(localStorage.getItem("ch_stars")||"0",10);
let owned=JSON.parse(localStorage.getItem("ch_owned")||"[0]");
let curSkin=parseInt(localStorage.getItem("ch_skin")||"0",10);
let lb=[];

const SKINS=[
{name:"کلاسیک",cost:0,ico:"📍"},
{name:"خنجر",cost:10,ico:"🗡️"},
{name:"شهاب",cost:25,ico:"☄️"},
{name:"الماس",cost:45,ico:"💎"},
{name:"لیزر",cost:70,ico:"⚡"},
{name:"سلطنتی",cost:100,ico:"👑"}
];

function updStars(){
localStorage.setItem("ch_stars",stars);
document.getElementById("hud-stars").innerText=stars;
document.getElementById("fab-stars").innerText=stars+"⭐";
document.getElementById("menu-stars").innerText=stars;
document.getElementById("shop-stars").innerText=stars;
}
updStars();
document.getElementById("hud-best").innerText=best;
function toast(m){const t=document.getElementById("toast");t.innerText=m;t.style.opacity="1";setTimeout(()=>t.style.opacity="0",2000)}

function openShop(){renderShop();document.getElementById("shop-screen").classList.remove("hd")}
function closeShop(){document.getElementById("shop-screen").classList.add("hd")}
function renderShop(){
updStars();
document.getElementById("skins-grid").innerHTML=SKINS.map((sk,i)=>{
const ok=owned.includes(i),act=curSkin===i;
return `<div class="skin-item ${act?'active':''} ${!ok?'locked':''}" onclick="pickSkin(${i})">
<div style="font-size:26px;margin-bottom:4px">${sk.ico}</div>
<div style="font-size:12px;font-weight:bold;margin-bottom:4px">${sk.name}</div>
<div style="font-size:11px;color:${act?'#4ade80':ok?'#cbd5e1':'#facc15'}">${act?'فعال ✅':ok?'انتخاب':sk.cost+' ⭐'}</div>
</div>`;
}).join("");
}
function pickSkin(i){
if(owned.includes(i)){curSkin=i;localStorage.setItem("ch_skin",i);beep(620,.08);renderShop();toast("طرح "+SKINS[i].name+" فعال شد!")}
else if(stars>=SKINS[i].cost){
stars-=SKINS[i].cost;owned.push(i);curSkin=i;
localStorage.setItem("ch_owned",JSON.stringify(owned));localStorage.setItem("ch_skin",i);
beep(800,.15);renderShop();toast("طرح "+SKINS[i].name+" خریداری شد!");
}else toast("ستاره کافی نداری! ستاره‌های دور دایره را بزن ⭐");
}

async function syncLB(sc){
try{
const r=await fetch(DB);let d=await r.json();if(!Array.isArray(d))d=[];
const i=d.findIndex(x=>x.id===usr.id);
if(i>-1){if(sc>d[i].score)d[i].score=sc;if(usr.name!=="بازیکن مهمان")d[i].name=usr.name;if(usr.photo)d[i].photo=usr.photo;if(d[i].score>best){best=d[i].score;localStorage.setItem("ch_best",best)}}
else if(sc>0){d.push({id:usr.id,name:usr.name,photo:usr.photo,score:sc})}
d.sort((a,b)=>b.score-a.score);d=d.slice(0,25);lb=d;
if(sc>0)await fetch(DB,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
}catch(e){}
document.getElementById("hud-best").innerText=best;
const rk=lb.findIndex(x=>x.id===usr.id);
document.getElementById("my-rank").innerText=rk>-1?`رتبه شما: #${rk+1}`:"";
const h=lb.length?lb.slice(0,10).map((p,idx)=>`<div class="lb-row ${p.id===usr.id?'me':''}"><div class="lb-user"><span style="width:22px;font-weight:900">${idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'#'+(idx+1)}</span>${avHtml(p)}<span class="lb-name">${p.name}</span></div><strong style="color:#facc15;margin-right:6px">${p.score}</strong></div>`).join(""):"<div style='text-align:center;color:#94a3b8;font-size:12px;padding:10px'>اولین نفر باش و رکورد بزن!</div>";
document.getElementById("lb-start").innerHTML=h;document.getElementById("lb-over").innerHTML=h;
}

let snd=true,ac=null;
function beep(f,d,t="sine"){if(!snd)return;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function toggleSound(){snd=!snd;document.getElementById("btn-snd").innerText=snd?"🔊":"🔇"}

const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W=360,H=640,CX=180,CY=270,R=88;
function resize(){
W=window.innerWidth>480?480:window.innerWidth;H=window.innerHeight;
cv.width=W;cv.height=H;CX=W/2;CY=H*0.41;R=Math.min(W,H)*0.22;
}
window.addEventListener("resize",resize);resize();

const PAL=["#facc15","#38bdf8","#f43f5e","#4ade80"];
let st="menu",score=0,lvl=1,rot=0,curSpd=0.03,targetSpd=0.03,rotTmr=0;
let segs=[],stuck=[],targetStars=[],fly=null,ricochet=null,readyY=0,nextColor="#facc15",knivesLeft=5,bounce=0,shake=0,parts=[],waveT=0,flash=0;

function norm(a){while(a<0)a+=Math.PI*2;while(a>=Math.PI*2)a-=Math.PI*2;return a}
function angDiff(a,b){let d=Math.abs(norm(a)-norm(b));return d>Math.PI?Math.PI*2-d:d}

function setupLevel(){
stuck=[];targetStars=[];fly=null;ricochet=null;bounce=0;readyY=H-60;
const numColors=lvl===1?1:lvl<=3?2:lvl<=6?3:4;
segs=[];
for(let i=0;i<numColors;i++)segs.push(PAL[i]);
knivesLeft=Math.min(9,4+Math.floor(lvl*0.65));
const baseSpd=0.028+Math.min(0.032,lvl*0.0024);
targetSpd=baseSpd*(Math.random()>0.5?1:-1);
curSpd=targetSpd;rotTmr=0;
const sCount=lvl%2===0?2:1;
for(let i=0;i<sCount;i++)targetStars.push({a:(Math.PI*2/sCount)*i+0.6,hit:false});
pickNextColor();
}

function pickNextColor(){
nextColor=segs[Math.floor(Math.random()*segs.length)];
readyY=H-55;
}

function boom(x,y,c,n,spd=4.5){
for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*spd+1.2;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c,sz:Math.random()*3.5+2})}
}

function startGame(){
document.getElementById("start-screen").classList.add("hd");
document.getElementById("over-screen").classList.add("hd");
document.getElementById("pause-screen").classList.add("hd");
score=0;lvl=1;parts=[];flash=0.4;
document.getElementById("hud-score").innerText="0";
setupLevel();st="play";beep(560,.1);
}
function togglePause(){
if(st==="play"){st="pause";document.getElementById("pause-screen").classList.remove("hd")}
else if(st==="pause"){st="play";document.getElementById("pause-screen").classList.add("hd")}
}
function openMenu(){st="menu";document.getElementById("over-screen").classList.add("hd");document.getElementById("pause-screen").classList.add("hd");document.getElementById("start-screen").classList.remove("hd");syncLB(0)}

document.getElementById("wrap").addEventListener("pointerdown",e=>{
if(e.target.closest("button")||e.target.closest(".overlay")||e.target.closest(".hud-left")||e.target.closest(".shop-fab")||st!=="play"||fly||ricochet)return;
fly={y:readyY,c:nextColor};
beep(540,.045);
});

function over(){
st="over";shake=15;beep(140,.35,"sawtooth");
if(score>best){best=score;localStorage.setItem("ch_best",best)}
document.getElementById("end-score").innerText=score;document.getElementById("end-best").innerText=best;
setTimeout(()=>{document.getElementById("over-screen").classList.remove("hd");syncLB(score)},520);
}

function drawNeedle(x,y,ang,col,scale=1){
ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(scale,scale);
const g=ctx.createLinearGradient(-4.5,0,4.5,0);
g.addColorStop(0,"#94a3b8");g.addColorStop(0.5,"#ffffff");g.addColorStop(1,"#64748b");
ctx.fillStyle=g;
if(curSkin===1){
ctx.beginPath();ctx.moveTo(0,-58);ctx.lineTo(6,-14);ctx.lineTo(3,-6);ctx.lineTo(-3,-6);ctx.lineTo(-6,-14);ctx.closePath();ctx.fill();
}else if(curSkin===3){
ctx.fillStyle="#e0f2fe";ctx.beginPath();ctx.moveTo(0,-58);ctx.lineTo(6,-32);ctx.lineTo(3.5,-6);ctx.lineTo(-3.5,-6);ctx.lineTo(-6,-32);ctx.closePath();ctx.fill();
}else{
ctx.beginPath();ctx.moveTo(0,-54);ctx.lineTo(4.5,-6);ctx.lineTo(-4.5,-6);ctx.closePath();ctx.fill();
}
ctx.fillStyle="#1e293b";ctx.beginPath();ctx.arc(0,0,8.5,0,6.28);ctx.fill();
ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,5.8,0,6.28);ctx.fill();
if(curSkin===2||curSkin===4){ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-54);ctx.lineTo(0,-9);ctx.stroke()}
if(curSkin===5){ctx.fillStyle="#fde047";ctx.fillRect(-6,-9,12,3.5)}
ctx.restore();
}

function drawStar(x,y,r){
ctx.save();ctx.translate(x,y);ctx.fillStyle="#f59e0b";ctx.strokeStyle="#fef08a";ctx.lineWidth=1.5;
ctx.beginPath();
for(let i=0;i<10;i++){const rad=i%2===0?r:r*0.48,a=i*Math.PI/5-Math.PI/2;ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}
ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}

function loop(){
waveT+=0.015;bounce*=0.78;shake*=0.84;
if(flash>0)flash=Math.max(0,flash-0.05);
readyY+=(H-95-readyY)*0.32;
ctx.clearRect(0,0,W,H);

ctx.fillStyle="#18181b";ctx.fillRect(0,0,W,H);
ctx.strokeStyle="rgba(255,255,255,0.032)";ctx.lineWidth=26;
for(let i=-2;i<6;i++){
ctx.beginPath();
for(let y=0;y<=H;y+=40)ctx.lineTo(i*95+Math.sin(y*0.008+waveT+i)*45,y);
ctx.stroke();
}

ctx.save();
if(shake>0.5)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

if(st==="play"){
rotTmr++;
const baseSpd=0.028+Math.min(0.032,lvl*0.0024);
if(lvl>=2&&rotTmr>95){
rotTmr=0;
const rMode=Math.random();
if(rMode<0.4)targetSpd*=-1;
else if(rMode<0.75)targetSpd=(targetSpd>0?1:-1)*baseSpd*1.45;
else targetSpd=(targetSpd>0?1:-1)*baseSpd*0.45;
}
// تغییر نرم سرعت (Easing) دقیقاً مثل GAMEE
curSpd+=(targetSpd-curSpd)*0.08;
rot=norm(rot+curSpd);

if(fly){
fly.y-=44;
if(fly.y<=CY+R+36){
const hitAng=norm(Math.PI/2-rot);
let crash=stuck.some(k=>angDiff(k.a,hitAng)<0.155);
const segSize=(Math.PI*2)/segs.length;
const segIdx=Math.floor(hitAng/segSize)%segs.length;
const hitColor=segs[segIdx];

if(crash||hitColor!==fly.c){
ricochet={x:CX,y:CY+R+36,vx:(Math.random()>0.5?1:-1)*5,vy:7,rot:0,vr:0.25,c:fly.c};
boom(CX,CY+R+24,"#f43f5e",22);
fly=null;over();
}else{
stuck.push({a:hitAng,c:fly.c});
bounce=10;score++;knivesLeft--;
document.getElementById("hud-score").innerText=score;
if(score>best)document.getElementById("hud-best").innerText=score;
boom(CX,CY+R,fly.c,12);
beep(650+(score%10)*35,.065);

targetStars.forEach(s=>{
if(!s.hit&&angDiff(s.a,hitAng)<0.26){
s.hit=true;stars++;updStars();
boom(CX,CY+R+18,"#facc15",16);beep(980,.12);
}
});

fly=null;
if(knivesLeft<=0){
segs.forEach(c=>boom(CX,CY,c,15,6.5));
flash=0.45;beep(880,.18);lvl++;
setTimeout(()=>{if(st==="play")setupLevel()},200);
}else pickNextColor();
}
}
}
}

if(ricochet){
ricochet.x+=ricochet.vx;ricochet.y+=ricochet.vy;ricochet.vy+=0.6;ricochet.rot+=ricochet.vr;
drawNeedle(ricochet.x,ricochet.y,ricochet.rot,ricochet.c,1);
}

const curY=CY-bounce;

stuck.forEach(k=>{
const worldA=k.a+rot;
const nx=CX+Math.cos(worldA)*(R+34),ny=curY+Math.sin(worldA)*(R+34);
drawNeedle(nx,ny,worldA-Math.PI/2,k.c,0.92);
});

targetStars.forEach(s=>{
if(!s.hit){
const worldA=s.a+rot;
drawStar(CX+Math.cos(worldA)*(R+18),curY+Math.sin(worldA)*(R+18),12);
}
});

const segSize=(Math.PI*2)/segs.length;
for(let i=0;i<segs.length;i++){
ctx.fillStyle=segs[i];
ctx.beginPath();ctx.moveTo(CX,curY);
ctx.arc(CX,curY,R,rot+i*segSize,rot+(i+1)*segSize+0.01);
ctx.closePath();ctx.fill();
}
const shd=ctx.createRadialGradient(CX-R*0.25,curY-R*0.25,R*0.1,CX,curY,R);
shd.addColorStop(0,"rgba(255,255,255,0.2)");
shd.addColorStop(1,"rgba(0,0,0,0.22)");
ctx.fillStyle=shd;ctx.beginPath();ctx.arc(CX,curY,R,0,6.28);ctx.fill();

if(st==="play"){
if(fly)drawNeedle(CX,fly.y,0,fly.c,1);
else drawNeedle(CX,readyY,0,nextColor,1);
}

for(let i=0;i<knivesLeft;i++){
ctx.save();ctx.translate(26,H-42-i*15);ctx.rotate(0.75);
ctx.fillStyle=i===0?nextColor:"rgba(255,255,255,0.35)";
ctx.beginPath();ctx.roundRect(-12,-2.5,24,5,2);ctx.fill();
ctx.restore();
}

parts.forEach((pt,i)=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.14;pt.l-=0.035;ctx.fillStyle=pt.c;ctx.globalAlpha=Math.max(0,pt.l);ctx.beginPath();ctx.arc(pt.x,pt.y,pt.sz,0,6.28);ctx.fill();if(pt.l<=0)parts.splice(i,1)});
ctx.globalAlpha=1;
if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H)}
ctx.restore();
requestAnimationFrame(loop);
}
syncLB(0);loop();

function shareScore(){
const txt=`🎯 رکورد من در بازی COLOR HIT شد: ${best} امتیاز!\nمی‌تونی با دقت و سرعت عملت رکوردم رو بزنی؟ 👇\n\n🎮 بازی‌های بیشتر و چالش‌های روزانه در کانال ما:\n${CHANNEL_ID} | ${CHANNEL_URL}`;
const shareUrl=`https://ble.ir/share/url?url=${encodeURIComponent(BOT_LINK)}&text=${encodeURIComponent(txt)}`;
if(window.Bale&&Bale.WebApp&&Bale.WebApp.openLink)Bale.WebApp.openLink(shareUrl);
else if(navigator.share)navigator.share({title:"COLOR HIT PRO",text:txt,url:BOT_LINK}).catch(()=>{});
else window.open(shareUrl,"_blank");
}
</script>
