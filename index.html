<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>COLOR HIT PRO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;font-family:Tahoma,sans-serif}
html,body{width:100%;height:100%;background:#0f0f12;color:#fff;overflow:hidden}
#wrap{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;background:#18181b;overflow:hidden;touch-action:manipulation}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:0;left:0;right:0;height:54px;background:linear-gradient(180deg,rgba(10,10,14,.92),rgba(10,10,14,.65));backdrop-filter:blur(6px);padding:0 16px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none}
.hud-left{font-size:13px;color:#fbbf24;font-weight:bold;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:10px}
.score-val{font-size:25px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.hud-btns{display:flex;gap:8px;pointer-events:auto}
.icon-btn{width:35px;height:35px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:14px;display:flex;justify-content:center;align-items:center;cursor:pointer;transition:transform .1s}
.icon-btn:active{transform:scale(.92)}
.shop-fab{position:absolute;top:66px;left:16px;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.08);backdrop-filter:blur(4px);border:1.5px solid rgba(255,255,255,.32);display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;z-index:12;font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.shop-fab span{font-size:9px;color:#fbbf24;font-weight:bold;margin-top:1px}
.overlay{position:absolute;inset:0;background:rgba(14,14,18,.95);backdrop-filter:blur(8px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;z-index:25}
.hd{display:none!important}
.logo{font-size:32px;font-weight:900;color:#facc15;margin-bottom:6px;letter-spacing:1px;text-shadow:0 4px 18px rgba(250,204,21,.3)}
.sub{font-size:12px;color:#cbd5e1;margin-bottom:14px;text-align:center}
.card{width:100%;max-width:350px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:bold;color:#fbbf24;margin-bottom:8px;display:flex;justify-content:space-between}
.lb-list{max-height:185px;overflow-y:auto}
.lb-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:10px;margin-bottom:5px;background:rgba(255,255,255,.04);font-size:13px}
.lb-row.me{background:rgba(250,204,21,.18);border:1px solid #facc15}
.lb-user{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.av{width:28px;height:28px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-weight:900;font-size:12px;color:#fff;flex-shrink:0;overflow:hidden;border:1px solid rgba(255,255,255,.3)}
.av img{width:100%;height:100%;object-fit:cover}
.lb-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold}
.btn{width:100%;max-width:350px;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer;margin-bottom:10px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-play{background:linear-gradient(135deg,#facc15,#f59e0b);color:#111;box-shadow:0 4px 16px rgba(245,158,11,.35)}
.btn-share{background:rgba(255,255,255,.1);color:#fff;font-size:13px;border:1px solid rgba(255,255,255,.12)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:350px;margin-bottom:12px}
.stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px;text-align:center}
.skins-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:350px;margin-bottom:14px}
.skin-item{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.15);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer}
.skin-item.active{border-color:#facc15;background:rgba(250,204,21,.16)}
.skin-item.locked{opacity:.65}
.brand-tag{margin-top:6px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:11px;color:#94a3b8;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.brand-tag b{color:#facc15;font-family:sans-serif;direction:ltr}
#toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:8px 16px;border-radius:12px;font-size:12px;font-weight:bold;z-index:50;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="wrap">
<div id="toast"></div>
<div class="hud">
<div class="hud-left" onclick="openMenu()"><span>🏆 <span id="hud-best">0</span></span><span style="color:#fde047">⭐ <span id="hud-stars">0</span></span></div>
<div class="score-val" id="hud-score">0</div>
<div class="hud-btns">
<button class="icon-btn" id="btn-snd" onclick="toggleSound()">🔊</button>
<button class="icon-btn" id="btn-pause" onclick="togglePause()">⏸</button>
</div>
</div>

<div class="shop-fab" id="shop-btn" onclick="openShop()">🛒<span id="fab-stars">0⭐</span></div>
<canvas id="cv"></canvas>

<div class="overlay" id="start-screen">
<div class="logo">🎯 COLOR HIT</div>
<div class="sub">چاقوهای رنگی را به بخش هم‌رنگ بزن و باس‌های مراحل را شکست بده!</div>
<div class="card">
<div class="card-title"><span>🏆 برترین رکوردهای بازیکنان</span><span id="my-rank" style="color:#fff;font-size:11px"></span></div>
<div class="lb-list" id="lb-start">در حال دریافت...</div>
</div>
<button class="btn btn-play" onclick="startGame()">شروع بازی</button>
<button class="btn btn-share" onclick="openShop()">🛒 فروشگاه طرح چاقوها (⭐ <span id="menu-stars">0</span>)</button>
<div class="brand-tag" onclick="openChannel()">🎮 اختصاصی کانال <b>@gamee_balee</b></div>
</div>

<div class="overlay hd" id="shop-screen">
<div class="logo" style="font-size:24px">🛒 فروشگاه طرح‌ها</div>
<div class="sub">موجودی ستاره شما: <b style="color:#facc15" id="shop-stars">0</b> ⭐</div>
<div class="skins-grid" id="skins-grid"></div>
<button class="btn btn-play" onclick="closeShop()">بازگشت</button>
</div>

<div class="overlay hd" id="pause-screen">
<div class="logo" style="color:#38bdf8">توقف بازی</div>
<button class="btn btn-play" onclick="togglePause()">▶️ ادامه بازی</button>
<button class="btn btn-share" onclick="openMenu()">🏠 منو و رده‌بندی</button>
</div>

<div class="overlay hd" id="over-screen">
<div class="logo" style="color:#f43f5e">GAME OVER</div>
<div class="stats">
<div class="stat"><div style="font-size:22px;font-weight:900;color:#facc15" id="end-score">0</div><div style="font-size:11px;color:#94a3b8">امتیاز</div></div>
<div class="stat"><div style="font-size:22px;font-weight:900;color:#4ade80" id="end-best">0</div><div style="font-size:11px;color:#94a3b8">رکورد شما</div></div>
</div>
<div class="card">
<div class="card-title"><span>🏆 جدول نفرات برتر</span></div>
<div class="lb-list" id="lb-over"></div>
</div>
<button class="btn btn-play" onclick="startGame()">🔄 بازی مجدد</button>
<button class="btn btn-share" onclick="shareScore()">📤 کل‌کل و ارسال رکورد</button>
<div class="brand-tag" onclick="openChannel()">🎮 اختصاصی کانال <b>@gamee_balee</b></div>
</div>
</div>

<script>
const DB="https://kido-db.mohammadahmadi0007.workers.dev/colorhit_lb.json";
const BOT_LINK="https://ble.ir/color_hit_game_bot";
const CHANNEL_ID="@gamee_balee";
const CHANNEL_URL="https://ble.ir/gamee_balee";

function openChannel(){
if(window.Bale&&Bale.WebApp&&Bale.WebApp.openLink)Bale.WebApp.openLink(CHANNEL_URL);
else window.open(CHANNEL_URL,"_blank");
}

let usr={id:localStorage.getItem("ch_uid")||("u_"+Math.floor(1e5+Math.random()*9e5)),name:"بازیکن مهمان",photo:""};
localStorage.setItem("ch_uid",usr.id);
try{
const raw=(location.hash||"")+"&"+(location.search||"");
const m=raw.match(/(?:tgWebAppData|baleWebAppData)=([^&]+)/);
if(m&&m[1]){const u=JSON.parse(new URLSearchParams(decodeURIComponent(m[1])).get("user"));if(u&&u.id){usr.id="b_"+u.id;usr.name=[u.first_name,u.last_name].filter(Boolean).join(" ")||"کاربر بله";if(u.photo_url)usr.photo=u.photo_url}}
if(window.Bale&&Bale.WebApp){Bale.WebApp.ready();Bale.WebApp.expand();const u=Bale.WebApp.initDataUnsafe&&Bale.WebApp.initDataUnsafe.user;if(u&&u.id){usr.id="b_"+u.id;usr.name=[u.first_name,u.last_name].filter(Boolean).join(" ")||"کاربر بله";if(u.photo_url)usr.photo=u.photo_url}}
}catch(e){}

const GRADS=["linear-gradient(135deg,#06b6d4,#3b82f6)","linear-gradient(135deg,#ec4899,#8b5cf6)","linear-gradient(135deg,#f59e0b,#ef4444)","linear-gradient(135deg,#10b981,#059669)","linear-gradient(135deg,#6366f1,#a855f7)"];
function avHtml(p){
let s=0;for(let i=0;i<p.id.length;i++)s+=p.id.charCodeAt(i);
const bg=GRADS[s%GRADS.length],ch=(p.name||"؟").trim().charAt(0);
return p.photo?`<div class="av" style="background:${bg}"><img src="${p.photo}" onerror="this.parentNode.innerText='${ch}'"></div>`:`<div class="av" style="background:${bg}">${ch}</div>`;
}

let best=parseInt(localStorage.getItem("ch_best")||"0",10);
let stars=parseInt(localStorage.getItem("ch_stars")||"0",10);
let owned=JSON.parse(localStorage.getItem("ch_owned")||"[0]");
let curSkin=parseInt(localStorage.getItem("ch_skin")||"0",10);
let lb=[];

const SKINS=[
{name:"کلاسیک",cost:0,ico:"📍"},
{name:"خنجر",cost:10,ico:"🗡️"},
{name:"شهاب",cost:25,ico:"☄️"},
{name:"الماس",cost:45,ico:"💎"},
{name:"لیزر",cost:70,ico:"⚡"},
{name:"سلطنتی",cost:100,ico:"👑"}
];

function updStars(){
localStorage.setItem("ch_stars",stars);
document.getElementById("hud-stars").innerText=stars;
document.getElementById("fab-stars").innerText=stars+"⭐";
document.getElementById("menu-stars").innerText=stars;
document.getElementById("shop-stars").innerText=stars;
}
updStars();
document.getElementById("hud-best").innerText=best;
function toast(m){const t=document.getElementById("toast");t.innerText=m;t.style.opacity="1";setTimeout(()=>t.style.opacity="0",2000)}

function openShop(){renderShop();document.getElementById("shop-screen").classList.remove("hd")}
function closeShop(){document.getElementById("shop-screen").classList.add("hd")}
function renderShop(){
updStars();
document.getElementById("skins-grid").innerHTML=SKINS.map((sk,i)=>{
const ok=owned.includes(i),act=curSkin===i;
return `<div class="skin-item ${act?'active':''} ${!ok?'locked':''}" onclick="pickSkin(${i})">
<div style="font-size:26px;margin-bottom:4px">${sk.ico}</div>
<div style="font-size:12px;font-weight:bold;margin-bottom:4px">${sk.name}</div>
<div style="font-size:11px;color:${act?'#4ade80':ok?'#cbd5e1':'#facc15'}">${act?'فعال ✅':ok?'انتخاب':sk.cost+' ⭐'}</div>
</div>`;
}).join("");
}
function pickSkin(i){
if(owned.includes(i)){curSkin=i;localStorage.setItem("ch_skin",i);beep(620,.08);renderShop();toast("طرح "+SKINS[i].name+" فعال شد!")}
else if(stars>=SKINS[i].cost){
stars-=SKINS[i].cost;owned.push(i);curSkin=i;
localStorage.setItem("ch_owned",JSON.stringify(owned));localStorage.setItem("ch_skin",i);
beep(800,.15);renderShop();toast("طرح "+SKINS[i].name+" خریداری شد!");
}else toast("ستاره کافی نداری! ⭐");
}

async function syncLB(sc){
try{
const r=await fetch(DB);let d=await r.json();if(!Array.isArray(d))d=[];
const i=d.findIndex(x=>x.id===usr.id);
if(i>-1){if(sc>d[i].score)d[i].score=sc;if(usr.name!=="بازیکن مهمان")d[i].name=usr.name;if(usr.photo)d[i].photo=usr.photo;if(d[i].score>best){best=d[i].score;localStorage.setItem("ch_best",best)}}
else if(sc>0){d.push({id:usr.id,name:usr.name,photo:usr.photo,score:sc})}
d.sort((a,b)=>b.score-a.score);d=d.slice(0,25);lb=d;
if(sc>0)await fetch(DB,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
}catch(e){}
document.getElementById("hud-best").innerText=best;
const rk=lb.findIndex(x=>x.id===usr.id);
document.getElementById("my-rank").innerText=rk>-1?`رتبه شما: #${rk+1}`:"";
const h=lb.length?lb.slice(0,10).map((p,idx)=>`<div class="lb-row ${p.id===usr.id?'me':''}"><div class="lb-user"><span style="width:22px;font-weight:900">${idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'#'+(idx+1)}</span>${avHtml(p)}<span class="lb-name">${p.name}</span></div><strong style="color:#facc15;margin-right:6px">${p.score}</strong></div>`).join(""):"<div style='text-align:center;color:#94a3b8;font-size:12px;padding:10px'>اولین نفر باش و رکورد بزن!</div>";
document.getElementById("lb-start").innerHTML=h;document.getElementById("lb-over").innerHTML=h;
}

let snd=true,ac=null,bgmInt=null,beatStep=0;
function initAudio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}
function beep(f,d,t="sine",v=0.14){
if(!snd)return;
try{
initAudio();
const o=ac.createOscillator(),g=ac.createGain();
o.type=t;o.frequency.value=f;
g.gain.setValueAtTime(v,ac.currentTime);
g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
}catch(e){}
}
function playChime(){
[523.25,659.25,783.99,1046.5].forEach((f,i)=>setTimeout(()=>beep(f,.18,"triangle",0.12),i*65));
}
function startBGM(){
stopBGM();if(!snd)return;
const bass=[110,110,146.8,130.8,110,110,164.8,146.8];
const lead=[440,0,523.2,587.3,659.2,0,523.2,440];
bgmInt=setInterval(()=>{
if(!snd||st!=="play")return;
const b=bass[beatStep%8],l=lead[beatStep%8];
beep(b,0.16,"triangle",0.055);
if(beatStep%2===1)beep(900,0.03,"square",0.015);
if(l>0&&beatStep%2===0)beep(l,0.14,"sine",0.035);
beatStep++;
},210);
}
function stopBGM(){if(bgmInt){clearInterval(bgmInt);bgmInt=null}}
function toggleSound(){
snd=!snd;document.getElementById("btn-snd").innerText=snd?"🔊":"🔇";
if(snd&&st==="play")startBGM();else stopBGM();
}

// رندرینگ باکیفیت رتینا (High-DPI Retina) برای وضوح فوق‌العاده روی گوشی‌ها
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W=360,H=640,CX=180,CY=265,R=102,DPR=1;
function resize(){
W=window.innerWidth>480?480:window.innerWidth;H=window.innerHeight;
DPR=Math.min(3,window.devicePixelRatio||1);
cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
ctx.setTransform(DPR,0,0,DPR,0,0);
CX=W/2;CY=H*0.39;R=Math.min(W,H)*0.265;
}
window.addEventListener("resize",resize);resize();

const PAL=["#facc15","#0ea5e9","#ef4444","#22c55e"];
let st="menu",score=0,lvl=1,rot=0,rotSpd=1.85;
let segs=[],stuck=[],pickups=[],queue=[],fly=null,ricochet=null,brokenKnives=[];
let readyY=0,bounce=0,shake=0,hitGlow=0,parts=[],floats=[],waveT=0,flash=0,aimUntil=0,lastT=0;

function norm(a){while(a<0)a+=Math.PI*2;while(a>=Math.PI*2)a-=Math.PI*2;return a}
function angDiff(a,b){let d=Math.abs(norm(a)-norm(b));return d>Math.PI?Math.PI*2-d:d}

function setupLevel(){
stuck=[];pickups=[];fly=null;ricochet=null;bounce=0;hitGlow=0;readyY=H-52;
const isBoss=(lvl%3===0);
const numColors=lvl===1?1:lvl===2?2:isBoss?4:3;
segs=[];
for(let i=0;i<numColors;i++)segs.push(PAL[i]);

const totalKnives=Math.min(10,5+Math.floor(lvl*0.7));
queue=[];
for(let i=0;i<totalKnives;i++)queue.push(segs[Math.floor(Math.random()*segs.length)]);

if(lvl>=3){
const preCount=isBoss?2:1;
for(let i=0;i<preCount;i++){
const a=(Math.PI*2/preCount)*i+0.45;
stuck.push({a,c:"#cbd5e1",pre:true});
}
}

// سرعت چرخش یک‌طرفه بر حسب رادیان بر ثانیه (مستقل از نرخ فریم گوشی)
rotSpd=1.8+Math.min(1.5,lvl*0.14);

const starA=1.25;
if(!stuck.some(k=>angDiff(k.a,starA)<0.35)){
pickups.push({a:starA,type:"star",hit:false});
}
if(lvl>=2){
const aimA=starA+Math.PI;
if(!stuck.some(k=>angDiff(k.a,aimA)<0.35)){
pickups.push({a:aimA,type:"aim",hit:false});
}
}
}

function boom(x,y,c,n,spd=280){
for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*spd+90;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c,sz:Math.random()*4.2+2.2})}
}
function addFloat(x,y,txt,col="#fff"){
floats.push({x,y,txt,col,l:1});
}

function startGame(){
document.getElementById("start-screen").classList.add("hd");
document.getElementById("over-screen").classList.add("hd");
document.getElementById("pause-screen").classList.add("hd");
score=0;lvl=1;parts=[];floats=[];brokenKnives=[];flash=0.35;aimUntil=0;lastT=0;
document.getElementById("hud-score").innerText="0";
setupLevel();st="play";initAudio();beep(560,.1);startBGM();
}
function togglePause(){
if(st==="play"){st="pause";document.getElementById("pause-screen").classList.remove("hd")}
else if(st==="pause"){st="play";lastT=0;document.getElementById("pause-screen").classList.add("hd")}
}
function openMenu(){st="menu";stopBGM();document.getElementById("over-screen").classList.add("hd");document.getElementById("pause-screen").classList.add("hd");document.getElementById("start-screen").classList.remove("hd");syncLB(0)}

const wrap=document.getElementById("wrap");
wrap.addEventListener("pointerdown",e=>{
if(e.target.closest("button")||e.target.closest(".overlay")||e.target.closest(".hud-left")||e.target.closest(".shop-fab")||st!=="play")return;
if(!fly&&!ricochet&&queue.length>0){
fly={y:readyY,startY:readyY,c:queue[0]};
beep(540,.045,"triangle");
}
});

function triggerFail(){
st="over";stopBGM();shake=16;beep(130,.35,"sawtooth");aimUntil=0;
if(score>best){best=score;localStorage.setItem("ch_best",best)}
document.getElementById("end-score").innerText=score;document.getElementById("end-best").innerText=best;
setTimeout(()=>{document.getElementById("over-screen").classList.remove("hd");syncLB(score)},500);
}

function drawNeedle(x,y,ang,col,scale=1,isPre=false){
ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(scale,scale);
if(isPre){
ctx.fillStyle="#e2e8f0";
ctx.beginPath();ctx.roundRect(-4.5,-44,9,44,4.5);ctx.fill();
ctx.fillStyle="#94a3b8";
ctx.beginPath();ctx.roundRect(0,-44,4.5,44,[0,4.5,4.5,0]);ctx.fill();
ctx.restore();
return;
}
const g=ctx.createLinearGradient(-4.5,0,4.5,0);
g.addColorStop(0,"#94a3b8");g.addColorStop(0.45,"#ffffff");g.addColorStop(1,"#475569");
ctx.fillStyle=g;
if(curSkin===1){
ctx.beginPath();ctx.moveTo(0,-58);ctx.lineTo(6,-14);ctx.lineTo(3,-6);ctx.lineTo(-3,-6);ctx.lineTo(-6,-14);ctx.closePath();ctx.fill();
}else if(curSkin===3){
ctx.fillStyle="#e0f2fe";ctx.beginPath();ctx.moveTo(0,-58);ctx.lineTo(6,-32);ctx.lineTo(3.5,-6);ctx.lineTo(-3.5,-6);ctx.lineTo(-6,-32);ctx.closePath();ctx.fill();
}else{
ctx.beginPath();ctx.moveTo(0,-55);ctx.lineTo(4.6,-6);ctx.lineTo(-4.6,-6);ctx.closePath();ctx.fill();
}
// حلقه دسته با سایه و هایلایت براق
ctx.fillStyle="#18181b";ctx.beginPath();ctx.arc(0,0,9,0,6.28);ctx.fill();
ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,6.2,0,6.28);ctx.fill();
ctx.fillStyle="rgba(255,255,255,0.45)";ctx.beginPath();ctx.arc(-1.8,-1.8,2,0,6.28);ctx.fill();
if(curSkin===2||curSkin===4){ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-54);ctx.lineTo(0,-9);ctx.stroke()}
if(curSkin===5){ctx.fillStyle="#fde047";ctx.fillRect(-6,-9,12,3.5)}
ctx.restore();
}

function drawStar(x,y,r){
ctx.save();ctx.translate(x,y);
ctx.shadowColor="rgba(250,204,21,0.5)";ctx.shadowBlur=10;
ctx.fillStyle="#f59e0b";ctx.strokeStyle="#fef08a";ctx.lineWidth=1.5;
ctx.beginPath();
for(let i=0;i<10;i++){const rad=i%2===0?r:r*0.48,a=i*Math.PI/5-Math.PI/2;ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}
ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}

function drawAimPickup(x,y,r){
ctx.save();ctx.translate(x,y);
ctx.shadowColor="rgba(255,255,255,0.6)";ctx.shadowBlur=10;
ctx.fillStyle="#18181b";ctx.beginPath();ctx.arc(0,0,r,0,6.28);ctx.fill();
ctx.strokeStyle="#ffffff";ctx.lineWidth=2;ctx.stroke();
ctx.beginPath();ctx.moveTo(-r-3,0);ctx.lineTo(r+3,0);ctx.moveTo(0,-r-3);ctx.lineTo(0,r+3);ctx.stroke();
ctx.fillStyle="#ffffff";ctx.beginPath();ctx.arc(0,0,3.2,0,6.28);ctx.fill();
ctx.restore();
}

function drawBossFace(x,y,r){
ctx.save();ctx.translate(x,y);
ctx.beginPath();ctx.arc(0,0,r,0,6.28);ctx.clip();

ctx.fillStyle="#facc15";
ctx.fillRect(-r,-r,r*2,r*2);

ctx.fillStyle="#ea8c00";
ctx.beginPath();ctx.arc(0,0,r,0,6.28);
ctx.arc(0,r*0.24,r*0.86,0,6.28,true);
ctx.fill();

ctx.fillStyle="#78350f";ctx.strokeStyle="#c2410c";ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(-r*0.64,-r*0.08);
ctx.lineTo(-r*0.14,r*0.04);
ctx.lineTo(-r*0.45,r*0.22);
ctx.closePath();ctx.fill();ctx.stroke();

ctx.beginPath();
ctx.moveTo(r*0.64,-r*0.08);
ctx.lineTo(r*0.14,r*0.04);
ctx.lineTo(r*0.45,r*0.22);
ctx.closePath();ctx.fill();ctx.stroke();

ctx.fillStyle="#78350f";ctx.strokeStyle="#c2410c";ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(-r*0.62,r*0.22);
ctx.lineTo(-r*0.32,r*0.36);
ctx.lineTo(-r*0.24,r*0.26);
ctx.lineTo(-r*0.08,r*0.38);
ctx.lineTo(r*0.08,r*0.38);
ctx.lineTo(r*0.24,r*0.26);
ctx.lineTo(r*0.32,r*0.36);
ctx.lineTo(r*0.62,r*0.22);
ctx.quadraticCurveTo(r*0.48,r*0.76,0,r*0.76);
ctx.quadraticCurveTo(-r*0.48,r*0.76,-r*0.62,r*0.22);
ctx.closePath();ctx.fill();ctx.stroke();

ctx.restore();
ctx.strokeStyle="#422006";ctx.lineWidth=2.5;
ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.stroke();
}

function loop(now){
if(!lastT)lastT=now;
const dt=Math.min(0.05,(now-lastT)/1000);
lastT=now;

waveT+=0.9*dt;
bounce*=Math.pow(0.0004,dt);
shake*=Math.pow(0.0005,dt);
hitGlow=Math.max(0,hitGlow-3.5*dt);
if(flash>0)flash=Math.max(0,flash-2.8*dt);
readyY+=(H-95-readyY)*(1-Math.pow(0.00001,dt));

ctx.clearRect(0,0,W,H);

// پس‌زمینه موج‌دار با عمق و کنتراست بالا
const bgGrd=ctx.createRadialGradient(CX,CY,R*0.5,CX,H*0.5,H*0.8);
bgGrd.addColorStop(0,"#222227");bgGrd.addColorStop(1,"#131316");
ctx.fillStyle=bgGrd;ctx.fillRect(0,0,W,H);

ctx.strokeStyle="rgba(255,255,255,0.028)";ctx.lineWidth=28;
for(let i=-2;i<6;i++){
ctx.beginPath();
for(let y=0;y<=H;y+=36)ctx.lineTo(i*95+Math.sin(y*0.008+waveT+i)*45,y);
ctx.stroke();
}

ctx.save();
if(shake>0.4)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

if(st==="play"){
rot=norm(rot+rotSpd*dt);

if(fly){
fly.y-=2900*dt;
if(fly.y<=CY+R+36){
const hitAng=norm(Math.PI/2-rot);
let crash=stuck.some(k=>angDiff(k.a,hitAng)<0.155);
const segSize=(Math.PI*2)/segs.length;
const segIdx=Math.floor(hitAng/segSize)%segs.length;
const hitColor=segs[segIdx];

if(crash||hitColor!==fly.c){
ricochet={x:CX,y:CY+R+36,vx:(Math.random()>0.5?1:-1)*320,vy:420,rot:0,vr:15,c:fly.c};
boom(CX,CY+R+24,"#ef4444",24);
fly=null;triggerFail();
}else{
stuck.push({a:hitAng,c:fly.c,pre:false});
queue.shift();readyY=H-48;
bounce=11;hitGlow=0.45;let pts=11;
boom(CX,CY+R,fly.c,14);
beep(650+(score%10)*35,.065);

pickups.forEach(p=>{
if(!p.hit&&angDiff(p.a,hitAng)<0.27){
p.hit=true;
if(p.type==="star"){
stars++;updStars();pts=21;boom(CX,CY+R+18,"#facc15",18);beep(980,.12);
}else if(p.type==="aim"){
aimUntil=Date.now()+7000;
pts=21;boom(CX,CY+R+18,"#ffffff",18);beep(1050,.15);
toast("🎯 نشانه‌گیر ۷ ثانیه‌ای فعال شد!");
}
}
});

score+=pts;
document.getElementById("hud-score").innerText=score;
if(score>best)document.getElementById("hud-best").innerText=score;
addFloat(CX+(Math.random()*28-14),CY+R+28,"+"+pts,pts>11?"#facc15":"#fff");

fly=null;
if(queue.length===0){
segs.forEach(c=>boom(CX,CY,c,18,380));
stuck.forEach(k=>{
const wa=k.a+rot;
brokenKnives.push({x:CX+Math.cos(wa)*(R+34),y:CY+Math.sin(wa)*(R+34),vx:Math.cos(wa)*420,vy:Math.sin(wa)*420-160,rot:wa-Math.PI/2,vr:(Math.random()-0.5)*16,c:k.c,pre:k.pre,l:1});
});
stuck=[];pickups=[];flash=0.4;playChime();lvl++;
setTimeout(()=>{if(st==="play")setupLevel()},250);
}
}
}
}
}

brokenKnives.forEach((bk,i)=>{
bk.x+=bk.vx*dt;bk.y+=bk.vy*dt;bk.vy+=1100*dt;bk.rot+=bk.vr*dt;bk.l-=1.5*dt;
ctx.globalAlpha=Math.max(0,bk.l);
drawNeedle(bk.x,bk.y,bk.rot,bk.c,0.9,bk.pre);
if(bk.l<=0)brokenKnives.splice(i,1);
});
ctx.globalAlpha=1;

if(ricochet){
ricochet.x+=ricochet.vx*dt;ricochet.y+=ricochet.vy*dt;ricochet.vy+=1600*dt;ricochet.rot+=ricochet.vr*dt;
drawNeedle(ricochet.x,ricochet.y,ricochet.rot,ricochet.c,1,false);
}

const curY=CY-bounce;
const isBoss=(lvl%3===0);

// سایه نرم زیر دایره مرکزی
ctx.fillStyle="rgba(0,0,0,0.35)";
ctx.beginPath();ctx.arc(CX,curY+10,R+2,0,6.28);ctx.fill();

stuck.forEach(k=>{
const worldA=k.a+rot;
drawNeedle(CX+Math.cos(worldA)*(R+34),curY+Math.sin(worldA)*(R+34),worldA-Math.PI/2,k.c,0.92,k.pre);
});

pickups.forEach(p=>{
if(!p.hit){
const worldA=p.a+rot;
const px=CX+Math.cos(worldA)*(R+20),py=curY+Math.sin(worldA)*(R+20);
if(p.type==="star")drawStar(px,py,12);
else if(p.type==="aim")drawAimPickup(px,py,10);
}
});

// رسم بخش‌های رنگی دایره
const segSize=(Math.PI*2)/segs.length;
for(let i=0;i<segs.length;i++){
ctx.fillStyle=segs[i];
ctx.beginPath();ctx.moveTo(CX,curY);
ctx.arc(CX,curY,R,rot+i*segSize,rot+(i+1)*segSize+0.008);
ctx.closePath();ctx.fill();
}

// نورپردازی سه‌بعدی روی دایره
const shd=ctx.createRadialGradient(CX-R*0.28,curY-R*0.28,R*0.08,CX,curY,R);
shd.addColorStop(0,"rgba(255,255,255,0.24)");
shd.addColorStop(0.7,"rgba(255,255,255,0)");
shd.addColorStop(1,"rgba(0,0,0,0.24)");
ctx.fillStyle=shd;ctx.beginPath();ctx.arc(CX,curY,R,0,6.28);ctx.fill();

// درخشش سفید لحظه‌ای هنگام برخورد سوزن
if(hitGlow>0){
ctx.fillStyle=`rgba(255,255,255,${hitGlow})`;
ctx.beginPath();ctx.arc(CX,curY,R,0,6.28);ctx.fill();
}

if(isBoss)drawBossFace(CX,curY,R*0.62);

// خط نقطه‌چین سفید درخشان (فعال به مدت ۷ ثانیه پس از زدن آیتم نشانه‌گیر)
const aimRem=aimUntil-Date.now();
if(st==="play"&&aimRem>0&&queue.length>0){
ctx.save();
ctx.shadowColor="rgba(255,255,255,0.8)";ctx.shadowBlur=6;
ctx.fillStyle="#ffffff";
for(let y=readyY-68;y>curY+R+12;y-=18){
ctx.beginPath();ctx.arc(CX,y,3.2,0,6.28);ctx.fill();
}
ctx.restore();
const pct=Math.max(0,aimRem/7000);
ctx.fillStyle="rgba(255,255,255,0.18)";ctx.beginPath();ctx.roundRect(CX-35,H-28,70,4,2);ctx.fill();
ctx.fillStyle="#ffffff";ctx.beginPath();ctx.roundRect(CX-35,H-28,70*pct,4,2);ctx.fill();
}

// سوزن آماده پرتاب یا در حال پرواز با دنباله سرعتی
if(st==="play"){
if(fly){
const trl=ctx.createLinearGradient(CX,fly.y,CX,Math.min(fly.startY,fly.y+90));
trl.addColorStop(0,"rgba(255,255,255,0.35)");trl.addColorStop(1,"rgba(255,255,255,0)");
ctx.fillStyle=trl;ctx.fillRect(CX-3,fly.y,6,Math.min(90,fly.startY-fly.y));
drawNeedle(CX,fly.y,0,fly.c,1,false);
}else if(queue.length>0)drawNeedle(CX,readyY,0,queue[0],1,false);
}

for(let i=0;i<queue.length;i++){
ctx.save();ctx.translate(26,H-42-i*14);ctx.rotate(0.75);
ctx.fillStyle=queue[i];
ctx.beginPath();ctx.roundRect(-13,-2.8,26,5.6,2.5);ctx.fill();
ctx.restore();
}

floats.forEach((f,i)=>{
f.y-=78*dt;f.l-=1.8*dt;
ctx.globalAlpha=Math.max(0,f.l);ctx.fillStyle=f.col;
ctx.font="900 18px Tahoma";ctx.textAlign="center";
ctx.fillText(f.txt,f.x,f.y);
if(f.l<=0)floats.splice(i,1);
});

parts.forEach((pt,i)=>{pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=420*dt;pt.l-=2.1*dt;ctx.fillStyle=pt.c;ctx.globalAlpha=Math.max(0,pt.l);ctx.beginPath();ctx.arc(pt.x,pt.y,pt.sz,0,6.28);ctx.fill();if(pt.l<=0)parts.splice(i,1)});
ctx.globalAlpha=1;
if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H)}
ctx.restore();
requestAnimationFrame(loop);
}
syncLB(0);requestAnimationFrame(loop);

function shareScore(){
const txt=`🎯 رکورد من در بازی COLOR HIT شد: ${best} امتیاز!\nمی‌تونی با دقت و سرعت عملت رکوردم رو بزنی؟ 👇\n\n🎮 بازی‌های بیشتر و چالش‌های روزانه در کانال ما:\n${CHANNEL_ID} | ${CHANNEL_URL}`;
const shareUrl=`https://ble.ir/share/url?url=${encodeURIComponent(BOT_LINK)}&text=${encodeURIComponent(txt)}`;
if(window.Bale&&Bale.WebApp&&Bale.WebApp.openLink)Bale.WebApp.openLink(shareUrl);
else if(navigator.share)navigator.share({title:"COLOR HIT PRO",text:txt,url:BOT_LINK}).catch(()=>{});
else window.open(shareUrl,"_blank");
}
</script>
